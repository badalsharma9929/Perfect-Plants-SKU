name = "Post Purchase Revenue Engine"
client_id = "replace_with_shopify_api_key"
application_url = "https://your-app-domain.com"
embedded = true
handle = "post-purchase-revenue-engine"

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"

[access_scopes]
scopes = "read_products,read_orders,write_discounts,read_discounts,read_customers"

[auth]
redirect_urls = [
  "http://localhost:4000/auth/callback",
  "https://your-app-domain.com/auth/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"
